<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Bloom</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff5f8;color:#393038;font:16px/1.6 system-ui,sans-serif}header,main{max-width:1050px;margin:auto;padding:20px}header{display:flex;flex-wrap:wrap;align-items:center;gap:12px}h1{font-size:25px;margin:0;color:#a52e59}h2{font-size:22px}h3{margin-top:0}nav{display:flex;flex-wrap:wrap;gap:6px}button,input,select,textarea{font:inherit;border:1px solid #e5cbd5;border-radius:10px;padding:10px;background:white;color:inherit}button{cursor:pointer}button.primary,button.active{background:#a93660;color:white;border-color:#a93660}button:disabled{cursor:default;opacity:.85}textarea{width:100%;min-height:100px}input:not([type=checkbox]),select{max-width:100%;min-width:0}section{background:white;border:1px solid #f1dce4;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 3px 12px #71334d08}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px}.grid section{margin:0}.muted{color:#76636d;font-size:14px}.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.task{border-bottom:1px solid #f3e7ec;padding:9px 0;display:flex;gap:10px;align-items:center}.task span{flex:1}.done{text-decoration:line-through;color:#76636d}progress{width:100%;accent-color:#e86a92;height:12px}.options{display:grid;gap:10px}.options button{text-align:left}.correct{background:#e4f4e8!important;border-color:#39804b!important}.wrong{background:#ffe2e6!important;border-color:#b73950!important}.word{font-size:32px;font-weight:700;overflow-wrap:anywhere}a{color:#a52e59}label{display:block;margin:8px 0}small{color:#76636d} @media(max-width:600px){header,main{padding:12px}section{padding:15px}}
</style><header><h1>Study Bloom 🌷</h1><nav id="nav"></nav><span id="today" class="muted"></span></header><main><div class="line"><label for="date">学习日期</label><input id="date" type="date"></div><div id="app"></div></main><script>
'use strict';
const $=id=>document.getElementById(id), today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}, uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2), key='study-bloom-v1';
const defaults=()=>({tasks:[],words:{},answers:{},mastery:{},courses:['统计学','税法','高等数学（导数）'].map(name=>({id:uid(),name,date:'',plan:'',link:'',note:'',progress:0})),subjects:['政治','英语','数学','专业课'].map(name=>({id:uid(),name,plan:'',progress:0})),records:[],settings:{cet:'2026-12-12',graduate:'',school:'',major:'',stage:'',stageProgress:0}});
let s=defaults();try{const raw=localStorage.getItem(key);if(raw)s=JSON.parse(raw)}catch(e){alert('本地数据读取失败，暂时使用初始数据。')}
let page='home',date=today(),cursor=0,filter='all';const names={home:'首页',cet:'四六级',final:'期末考试',grad:'考研',settings:'设置'};
function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){alert('保存失败，请检查浏览器存储权限或空间，并及时导出。')}}
function el(tag,text,cls){let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function add(p,...nodes){p.append(...nodes);return p}function btn(text,fn,cls){let b=el('button',text,cls);b.onclick=fn;return b}function card(title){return add(el('section'),el('h3',title))}function field(value,placeholder,type='text'){let n=el('input');n.type=type;n.value=value??'';n.placeholder=placeholder;n.setAttribute('aria-label',placeholder);return n}function area(value,placeholder){let n=el('textarea');n.value=value??'';n.placeholder=placeholder;n.setAttribute('aria-label',placeholder);return n}function labeled(t,n){return add(el('label',t+' '),n)}function bar(p){let n=el('progress');n.max=100;n.value=p;return n}function pct(a,b){return b?Math.round(a/b*100):0}function days(d){if(!d)return '待设置考试日期';let a=Date.parse(d+'T00:00:00Z'),b=Date.parse(today()+'T00:00:00Z'),n=Math.round((a-b)/86400000);return n<0?'考试日期已过':n===0?'今天考试':`还有 ${n} 天`}
function seed(){if(!s.tasks.some(t=>t.date===date)&&date===today()&&!s.settings.seeded){['新故事背词','旧词复习','阅读真题','听力练习','写作练习','翻译练习','技巧课'].forEach(text=>s.tasks.push({id:uid(),date,group:'cet',text,done:false}));s.settings.seeded=true;save()}}
function tasks(group){let c=card('每日任务'),ts=s.tasks.filter(t=>t.date===date&&(group==='all'||t.group===group)),n=ts.filter(t=>t.done).length;add(c,el('p',`${n}/${ts.length} 已完成`,'muted'),bar(pct(n,ts.length)));for(let t of ts){let r=el('div',undefined,'task'),ch=field('','完成任务','checkbox');ch.checked=t.done;ch.onchange=()=>{t.done=ch.checked;save();render()};add(r,ch,el('span',(group==='all'?names[t.group]+' · ':'')+t.text,t.done?'done':''),btn('编辑',()=>{let v=prompt('修改任务',t.text);if(v?.trim()){t.text=v.trim();save();render()}}),btn('删除',()=>{if(confirm('删除此任务？')){s.tasks=s.tasks.filter(x=>x.id!==t.id);save();render()}}));c.append(r)}let f=field('','添加学习任务'),g=el('select');for(let k of ['cet','final','grad']){let o=el('option',names[k]);o.value=k;g.append(o)}g.value=group==='all'?'cet':group;let r=el('div',undefined,'line');if(group==='all')r.append(g);add(r,f,btn('添加',()=>{if(f.value.trim()){s.tasks.push({id:uid(),date,group:g.value,text:f.value.trim(),done:false});save();render()}},'primary'));c.append(r);return c}
function stats(){let w=s.words[date]||[],a=w.map(x=>s.answers[date]?.[x.id]).filter(Boolean);return {total:w.length,done:a.length,correct:a.filter(x=>x.ok).length}}
function quiz(){let c=card('单词训练'),z=stats();add(c,el('p',`今日 ${z.total} 词 · 已完成 ${z.done} · 正确率 ${pct(z.correct,z.done)}%`),bar(pct(z.done,z.total)));let all=s.words[date]||[],ws=all.filter(w=>filter==='all'||(filter==='review'?w.review:!w.review));let r=el('div',undefined,'line');for(let [k,v] of [['all','全部'],['new','新词'],['review','复习词']])r.append(btn(v,()=>{filter=k;cursor=0;render()},filter===k?'active':''));c.append(r);if(!ws.length){c.append(el('p','暂无此类单词，请导入单词。'));return c}cursor=Math.min(cursor,ws.length-1);let w=ws[cursor],a=s.answers[date]?.[w.id];add(c,el('p',`${cursor+1}/${ws.length} · ${w.review?'复习词':'新词'} · ${s.mastery[w.word.toLowerCase()]?.status||'未练习'}`,'muted'),el('div',w.word,'word'),el('p',w.phonetic||''));if('speechSynthesis'in window)c.append(btn('朗读单词',()=>{let u=new SpeechSynthesisUtterance(w.word);u.lang='en-US';speechSynthesis.speak(u)}));let opts=el('div',undefined,'options');w.options.forEach((v,i)=>{let b=btn(String.fromCharCode(65+i)+'. '+v,()=>{let ok=i===w.correctIndex;(s.answers[date]??={})[w.id]={selected:i,ok};s.mastery[w.word.toLowerCase()]={status:ok?'已答对':'待复习',date};save();render()},a?(i===w.correctIndex?'correct':i===a.selected?'wrong':''):'');b.disabled=!!a;opts.append(b)});c.append(opts);if(a)add(c,el('p',a.ok?'✓ 回答正确':'× 回答错误'),el('p',`正确答案：${w.meaning} ${w.partOfSpeech||''}`),el('p','例句：'+(w.example||'未提供')),el('p','备注：'+(w.note||'无')));add(c,add(el('div',undefined,'line'),btn('上一词',()=>{cursor=Math.max(0,cursor-1);render()}),btn('下一词',()=>{cursor=(cursor+1)%ws.length;render()},'primary'),btn('重练本词',()=>{if(s.answers[date])delete s.answers[date][w.id];save();render()})));return c}
const fallback=['获得','推迟','保护','减少','观察','解释','增加','选择','拒绝'];function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function parseWordList(raw, review){let data=JSON.parse(raw);if(!/^\d{4}-\d{2}-\d{2}$/.test(data.date)||!Number.isFinite(Date.parse(data.date))||new Date(data.date).toISOString().slice(0,10)!==data.date||!Array.isArray(data.words)||!data.words.length)throw Error('需要有效 date 和非空 words 数组');let seen=new Set(),pool=[...data.words.map(w=>w.meaning),...fallback].filter(x=>typeof x==='string'&&x.trim());let list=data.words.map(w=>{if(typeof w.word!=='string'||!w.word.trim()||typeof w.meaning!=='string'||!w.meaning.trim())throw Error('每个单词必须有 word 和 meaning');let word=w.word.trim(),meaning=w.meaning.trim(),k=word.toLowerCase();if(seen.has(k))throw Error('重复单词：'+word);seen.add(k);let options=w.options;if(options===undefined)options=shuffle([meaning,...shuffle([...new Set(pool)].filter(x=>x!==meaning)).slice(0,3)]);if(!Array.isArray(options)||options.length!==4||new Set(options).size!==4||options.some(x=>typeof x!=='string'||!x.trim())||!options.includes(meaning))throw Error(word+' 的选项必须为四个不同释义，包含 meaning');let correctIndex=options.indexOf(meaning);if(w.correctIndex!==undefined&&w.correctIndex!==correctIndex)throw Error(word+' 的 correctIndex 与 meaning 不一致');return {id:uid(),word,meaning,options,correctIndex,phonetic:String(w.phonetic||''),partOfSpeech:String(w.partOfSpeech||''),example:String(w.example||''),note:String(w.note||''),review}});
return {date:data.date, words:list};
}
function importWords(raw, review){
  const incoming = parseWordList(raw, review);
  const words = s.words[incoming.date] ??= [];
  const byWord = new Map(words.map(word => [word.word.toLowerCase(), word]));
  let added = 0;
  for (const word of incoming.words) {
    const existing = byWord.get(word.word.toLowerCase());
    if (existing) {
      existing.review = review;
    } else {
      words.push(word);
      added++;
    }
  }
  date = incoming.date;
  $('date').value = date;
  cursor = 0;
  filter = review ? 'review' : 'new';
  page = 'cet';
  save();
  render();
  alert(`${date} 已导入${review ? '旧词' : '新词'}。新增 ${added} 个，已有 ${incoming.words.length - added} 个。`);
}
function upload(){
  const c = card('导入单词');
  const columns = el('div', undefined, 'grid');
  for (const [review, label] of [[false, '新词'], [true, '旧词']]) {
    const panel = card(label);
    const input = field('', '选择' + label + ' JSON 文件', 'file');
    input.accept = '.json,application/json';
    const data = area('', '粘贴' + label + ' JSON 数据');
    input.onchange = async () => {
      data.value = '';
      if (!input.files[0]) return;
      try { data.value = await input.files[0].text(); }
      catch { alert('读取文件失败，请重新选择。'); }
    };
    add(panel, input, data, btn('导入' + label, () => {
      try { importWords(data.value, review); }
      catch (e) { alert(e.message); }
    }, 'primary'));
    columns.append(panel);
  }
  return add(c, el('p','新词和旧词按词表里的日期加入当天练习。重复词会归到本次选择的类别，并保留答题记录。','muted'), columns);
}
function records(group){let c=card(group==='cet'?'真题 / 错题本':'错题 / 知识点'),type=el('select');for(let t of (group==='cet'?['真题','错题']:['错题','知识点']))type.append(el('option',t));let a=area('','记录题目、得分、错误原因或知识点');add(c,type,a,btn('保存记录',()=>{if(a.value.trim()){s.records.push({id:uid(),group,date,type:type.value,text:a.value.trim()});save();render()}}));for(let r of s.records.filter(x=>x.group===group&&x.date===date)){add(c,el('p',r.type+' · '+r.text),btn('删除记录',()=>{if(confirm('删除记录？')){s.records=s.records.filter(x=>x.id!==r.id);save();render()}}))}if(group==='cet'){c.append(el('h3','待复习单词'));for(let [w,m] of Object.entries(s.mastery))if(m.status==='待复习')c.append(el('p',w+' · '+m.date))}return c}
function items(kind){let c=card(kind==='courses'?'课程列表':'科目计划'),arr=s[kind],grid=el('div',undefined,'grid');for(let x of arr){let p=card(x.name),n=field(x.name,'名称'),plan=area(x.plan,'复习计划'),pr=field(x.progress,'进度 0–100','number');pr.min=0;pr.max=100;add(p,bar(x.progress),labeled('名称',n),labeled('计划',plan),labeled('进度 %',pr));let d,l,no;if(kind==='courses'){d=field(x.date,'考试日期','date');l=field(x.link,'资料链接','url');no=area(x.note,'课程笔记');add(p,el('p',days(x.date)),labeled('考试日期',d),labeled('资料链接',l),no);try{let u=new URL(x.link);if(['https:','http:'].includes(u.protocol)){let a=el('a','打开资料');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';p.append(a)}}catch{}}add(p,add(el('div',undefined,'line'),btn('保存',()=>{x.name=n.value.trim()||x.name;x.plan=plan.value;x.progress=Math.max(0,Math.min(100,Number(pr.value)||0));if(d)Object.assign(x,{date:d.value,link:l.value,note:no.value});save();render()},'primary'),btn('删除',()=>{if(confirm('删除此项？')){s[kind]=arr.filter(y=>y.id!==x.id);save();render()}})));grid.append(p)}let n=field('','新增名称');add(c,grid,add(el('div',undefined,'line'),n,btn('新增',()=>{if(n.value.trim()){arr.push({id:uid(),name:n.value.trim(),plan:'',progress:0,date:'',link:'',note:''});save();render()}})));return c}
function config(grad=false){let c=card(grad?'考研目标':'考试设置'),fields=grad?[['school','目标院校'],['major','目标专业'],['graduate','考研日期','date'],['stage','阶段目标'],['stageProgress','阶段进度 %','number']]:[['cet','四六级日期','date']];let inputs=fields.map(([k,t,type])=>{let n=field(s.settings[k],t,type);c.append(labeled(t,n));return [k,n]});if(grad)c.append(bar(s.settings.stageProgress));c.append(btn('保存设置',()=>{for(let [k,n] of inputs)s.settings[k]=k==='stageProgress'?Math.max(0,Math.min(100,Number(n.value)||0)):n.value;save();render()},'primary'));return c}
function backup(){let c=card('数据管理');add(c,btn('导出全部数据',()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'})),a=el('a');a.href=u;a.download='study-bloom-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}),btn('清空全部数据',()=>{if(confirm('永久清空全部学习数据？建议先导出。')){s=defaults();s.settings.seeded=true;save();render()}}));return c}
function countdown(t,d){return add(card(t),el('h2',days(d)),el('p',d||'请在设置中填写','muted'))}
function render(){seed();$('today').textContent='今天 '+today();$('nav').replaceChildren(...Object.entries(names).map(([k,v])=>btn(v,()=>{page=k;cursor=0;render()},page===k?'active':'')));let a=$('app');a.replaceChildren(el('h2',names[page]));if(page==='home'){let z=stats(),g=el('div',undefined,'grid');add(g,countdown('四六级',s.settings.cet),countdown('考研',s.settings.graduate),add(card('单词进度'),el('h2',`${z.done}/${z.total}`),bar(pct(z.done,z.total)),btn('开始背词',()=>{page='cet';render()})));for(let x of s.courses)g.append(countdown(x.name,x.date));add(a,g,tasks('all'))}if(page==='cet')add(a,countdown('四六级倒计时',s.settings.cet),tasks('cet'),quiz(),upload(),records('cet'));if(page==='final')add(a,items('courses'),tasks('final'),records('final'));if(page==='grad')add(a,countdown('考研倒计时',s.settings.graduate),config(true),items('subjects'),tasks('grad'),records('grad'));if(page==='settings')add(a,config(),tasks('all'),upload(),backup())}
$('date').value=date;$('date').onchange=()=>{if($('date').value){date=$('date').value;cursor=0;filter='all';render()}};render();
</script></html>
